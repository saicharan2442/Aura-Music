<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura Music — Your Modern Music Experience</title>
    <meta name="description" content="Aura Music — a premium, lightweight music streaming experience for Windows." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #070a12; }
      #aura-splash {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 26px;
        background: radial-gradient(900px 500px at 20% 0%, rgba(124,108,255,.16), transparent 60%),
                    radial-gradient(800px 500px at 85% 100%, rgba(63,212,255,.12), transparent 60%), #070a12;
        color: #f2f4fb; font-family: 'Inter', system-ui, sans-serif;
        transition: opacity .5s ease, visibility .5s;
      }
      #aura-splash.done { opacity: 0; visibility: hidden; }
      #aura-splash .word { font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: .28em; font-size: 15px; text-transform: uppercase; }
      #aura-splash .bar { width: 148px; height: 3px; border-radius: 99px; background: rgba(255,255,255,.09); overflow: hidden; }
      #aura-splash .bar i { display: block; height: 100%; width: 40%; border-radius: 99px;
        background: linear-gradient(90deg, #7c6cff, #3fd4ff); animation: aura-slide 1.1s ease-in-out infinite; }
      #aura-splash .cap { font-size: 12px; color: #8b91b4; letter-spacing: .04em; }
      @keyframes aura-slide { 0% { transform: translateX(-140%);} 100% { transform: translateX(360%);} }
      @keyframes aura-pulse { 0%,100% { transform: scale(1); filter: drop-shadow(0 12px 30px rgba(124,108,255,.45)); } 50% { transform: scale(1.05); filter: drop-shadow(0 16px 40px rgba(63,212,255,.5)); } }
      #aura-splash svg { animation: aura-pulse 2.2s ease-in-out infinite; }
    </style>
  </head>
  <body>
    <div id="aura-splash" aria-hidden="true">
      <svg width="72" height="72" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7c6cff"/><stop offset="1" stop-color="#3fd4ff"/>
          </linearGradient>
        </defs>
        <rect width="32" height="32" rx="9" fill="url(#sg)" />
        <g fill="#070a12">
          <rect x="6.5" y="12" width="4" height="9" rx="2"/><rect x="14" y="6.5" width="4" height="19" rx="2"/><rect x="21.5" y="10" width="4" height="13" rx="2"/>
        </g>
      </svg>
      <div class="word">Aura Music</div>
      <div class="bar"><i></i></div>
      <div class="cap">Tuning your frequency…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
